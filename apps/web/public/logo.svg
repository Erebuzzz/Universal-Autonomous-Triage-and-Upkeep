<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="celestial-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="celestial-crimson-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#ff0055" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </radialGradient>
    <filter id="monolith-neon-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="monolith-neon-crimson" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Celestial Aura -->
  <circle cx="50" cy="50" r="44" fill="url(#celestial-core-glow)" />

  <!-- Outer Monolithic U Profile in Architectural Sacred Geometry -->
  <path
    d="M 24 18 
       L 24 58 
       C 24 74 36 86 50 86 
       C 64 86 76 74 76 58 
       L 76 18 
       L 66 18 
       L 66 58 
       C 66 68 59 75 50 75 
       C 41 75 34 68 34 58 
       L 34 18 
       Z"
    fill="#03070b"
    stroke="#00ff9d"
    stroke-width="2.2"
    stroke-linejoin="round"
    filter="url(#monolith-neon-emerald)"
  />

  <!-- Celestial Astrolabe Equator Line -->
  <line
    x1="12"
    y1="50"
    x2="88"
    y2="50"
    stroke="#00ff9d"
    stroke-width="1.2"
    stroke-dasharray="2 3"
    stroke-opacity="0.5"
  />

  <!-- Celestial Watcher Iris Outer Orbit Ring -->
  <circle
    cx="50"
    cy="48"
    r="16"
    fill="none"
    stroke="#00ff9d"
    stroke-width="1.6"
    stroke-dasharray="22 4"
  />

  <!-- Celestial Watcher Iris Inner Orbit Ring -->
  <circle
    cx="50"
    cy="48"
    r="10"
    fill="#050a0e"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-opacity="0.85"
  />

  <!-- All-Seeing Radiant Crimson Starlight Pupil -->
  <circle
    cx="50"
    cy="48"
    r="4.5"
    fill="#ff0055"
    filter="url(#monolith-neon-crimson)"
  />
  <circle cx="50" cy="48" r="1.5" fill="#ffffff" />

  <!-- Northern Celestial Meridian Tick -->
  <line
    x1="50"
    y1="10"
    x2="50"
    y2="18"
    stroke="#00ff9d"
    stroke-width="1.8"
    stroke-linecap="round"
  />
  <circle cx="50" cy="9" r="1.5" fill="#ff0055" />
</svg>
