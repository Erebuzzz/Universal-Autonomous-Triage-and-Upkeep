<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="u-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0" />
    </radialGradient>
    <filter id="neon-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-green" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" fill="#000000" rx="20" />
  <circle cx="50" cy="52" r="42" fill="url(#u-glow)" />

  <!-- Antenna with Beacon -->
  <line x1="50" y1="36" x2="50" y2="20" stroke="#00ff9d" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="18" r="4.5" fill="#ff0055" filter="url(#neon-red)" />
  <circle cx="50" cy="18" r="1.5" fill="#ffffff" />

  <!-- Robot Head -->
  <path d="M 37 66 L 37 49 C 37 37 63 37 63 49 L 63 66 Z" fill="#060d12" stroke="#00ff9d" stroke-width="2" />

  <!-- Red Pill Eyes -->
  <rect x="42.5" y="47" width="4.5" height="11" rx="2.25" fill="#ff0055" filter="url(#neon-red)" />
  <rect x="53" y="47" width="4.5" height="11" rx="2.25" fill="#ff0055" filter="url(#neon-red)" />

  <!-- Minimal U-Collar -->
  <path
    d="M 23 26 
       L 23 60 
       C 23 83 77 83 77 60 
       L 77 26 
       L 66 26 
       L 66 59 
       C 66 73 34 73 34 59 
       L 34 26 
       Z"
    fill="#04090c"
    stroke="#00ff9d"
    stroke-width="2.5"
    stroke-linejoin="round"
    filter="url(#neon-green)"
  />
</svg>
